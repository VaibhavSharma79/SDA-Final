# Seat Integrity Guard: everything runs in Docker.
#
#   docker compose up -d --build                      zookeeper, kafka, mysql, grafana, engine, alert-sink
#   docker compose --profile replay up site-sync-producer occupancy-producer     replay the simulated day (~1 minute)
#   docker compose run --rm engine python verify_alerts.py                       prove the alerts are exactly right
#
# Kafka has two listeners: INSIDE (kafka:9093) for the other containers, OUTSIDE (localhost:9092) for tools on your own machine.
# Brackets and pacing can be overridden per run, e.g.   NEAR_CAPACITY_PCT=80 docker compose up -d engine
services:
  zookeeper:
    image: wurstmeister/zookeeper
    ports:
      - "2181:2181"

  kafka:
    image: wurstmeister/kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INSIDE://0.0.0.0:9093,OUTSIDE://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:9093,OUTSIDE://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # name:partitions:replication. ONE partition each: the running head-count needs a single ordered stream.
      KAFKA_CREATE_TOPICS: "seat-site-sync:1:1,seat-occupancy:1:1,seat-alerts:1:1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server kafka:9093 --list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: seat_guard
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      # To get alert emails as well, point Grafana at an SMTP server and add an email receiver in
      # grafana/provisioning/alerting/contactpoints.yaml:
      #   GF_SMTP_ENABLED: "true"  GF_SMTP_HOST: smtp.example.com:587  GF_SMTP_USER: ...  GF_SMTP_PASSWORD: ...
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      mysql:
        condition: service_healthy
      alert-sink:
        condition: service_started

  # The stream-processing engine: Kafka -> rules -> MySQL (+ the seat-alerts topic). Long-running.
  engine:
    build: .
    command: python seat_guard_consumer.py
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      KAFKA_BROKER: kafka:9093
      MYSQL_HOST: mysql
      NEAR_CAPACITY_PCT: ${NEAR_CAPACITY_PCT:-90}
      SEAT_VARIANCE_TOLERANCE: ${SEAT_VARIANCE_TOLERANCE:-0.05}
      MASTER_REFRESH_SECONDS: ${MASTER_REFRESH_SECONDS:-10}
    depends_on:
      kafka:
        condition: service_healthy
      mysql:
        condition: service_healthy
    restart: on-failure

  # Stand-in notification endpoint: Grafana's webhook contact point posts here and the payload is printed.
  # Watch it with:  docker compose logs -f alert-sink
  alert-sink:
    build: .
    command: python alert_sink.py
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "5001:5001"

  # Replay jobs: start on demand with  --profile replay
  site-sync-producer:
    build: .
    profiles: ["replay"]
    command: python site_sync_producer.py
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      KAFKA_BROKER: kafka:9093
      SLEEP_PER_BUCKET: ${SLEEP_PER_BUCKET:-0.4}
    depends_on:
      engine:
        condition: service_started
    restart: "no"

  occupancy-producer:
    build: .
    profiles: ["replay"]
    command: python occupancy_producer.py
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      KAFKA_BROKER: kafka:9093
      SLEEP_PER_BUCKET: ${SLEEP_PER_BUCKET:-0.4}
    depends_on:
      engine:
        condition: service_started
    restart: "no"
